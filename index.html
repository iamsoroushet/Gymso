<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Gymso">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <title>Gymso — Workout Log</title>
  <style>
    :root{--ink:#0a0a0a;--muted:#747474;--line:#dedede;--soft:#f6f6f6;--bg:#fff}
    *{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
    button,input{font:inherit;color:inherit}button{cursor:pointer}
    .shell{width:min(100%,760px);margin:auto;min-height:100vh;padding:0 20px calc(92px + env(safe-area-inset-bottom))}
    header{display:flex;justify-content:space-between;align-items:flex-start;padding:calc(18px + env(safe-area-inset-top)) 0 14px;border-bottom:1px solid var(--line)}
    h1,h2,h3,p{margin:0}h1{font-size:2.05rem;letter-spacing:.09em;font-weight:650}h2{font-size:clamp(2.35rem,10vw,4rem);letter-spacing:-.045em;line-height:.95}
    .eyebrow{font-size:.7rem;letter-spacing:.13em;font-weight:700;margin-bottom:7px}.muted{color:var(--muted);font-size:.88rem}
    .icon,.text{border:0;background:transparent}.icon{font-size:1.55rem}.text{text-decoration:underline;text-underline-offset:4px;font-weight:600}
    .screen{display:none;padding:26px 0}.screen.active{display:block}
    .rowhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}
    .tabs{display:flex;gap:8px;overflow:auto;padding-bottom:18px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
    .chip{flex:0 0 auto;border:1px solid var(--ink);border-radius:999px;background:#fff;padding:9px 13px;font-size:.82rem;font-weight:600}.chip.active{background:var(--ink);color:#fff}
    .detail{border-top:1px solid var(--line);padding-top:22px}.detailhead{display:flex;justify-content:space-between;gap:18px}
    .stage{margin:20px 0 26px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);min-height:300px;display:grid;place-items:center;overflow:hidden}.stage svg{width:min(100%,560px)}.stage img{display:block;width:100%;height:auto;max-height:760px;object-fit:contain;background:#fff}
    .block{border-top:1px solid var(--line);padding:20px 0}.lastset{padding:10px 0;border-top:1px solid var(--line);font-size:1.02rem}.lastset:first-child{border-top:0}
    .thead,.setrow{display:grid;grid-template-columns:42px 1fr 1fr 42px;gap:10px;align-items:center}.thead{font-size:.67rem;letter-spacing:.11em;font-weight:700;padding-bottom:8px}.setrow{border-top:1px solid var(--line);padding:10px 0}
    .setrow input{width:100%;border:1px solid #bdbdbd;border-radius:10px;padding:10px 8px;text-align:center;font-size:1.05rem;background:#fff}.setrow input:focus{outline:2px solid var(--ink);outline-offset:1px}
    .done{width:34px;height:34px;border:1.5px solid var(--ink);border-radius:50%;background:#fff}.done.on{background:var(--ink);color:#fff}.done.on:after{content:"✓"}
    .addset{width:100%;border:0;background:#fff;padding:16px 0 0;font-weight:600}.rest{display:flex;justify-content:space-between;align-items:center}.timer{border:0;background:#fff;font-size:2rem;font-weight:600;letter-spacing:-.05em}
    .ask{display:grid;grid-template-columns:1fr 44px;border:1px solid #bdbdbd;border-radius:12px;overflow:hidden;margin-top:12px}.ask input{border:0;outline:none;padding:13px}.ask button{border:0;border-left:1px solid var(--line);background:#fff;font-size:1.25rem}.answer{margin-top:12px;background:var(--soft);padding:14px;border-radius:12px;font-size:.9rem;line-height:1.45}
    nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(4,1fr);background:rgba(255,255,255,.96);border-top:1px solid var(--line);padding:10px 14px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px)}
    .nav{border:0;background:transparent;color:var(--muted);font-size:.61rem;font-weight:700;display:grid;gap:4px;justify-items:center}.nav b{font-size:1.35rem;font-weight:400}.nav.active{color:var(--ink)}
    .search{display:grid;gap:7px;margin-bottom:20px}.search span{font-size:.68rem;letter-spacing:.11em;font-weight:700}.search input{border:0;border-bottom:1px solid var(--ink);padding:12px 0;outline:none;font-size:1.02rem}
    .list{border-top:1px solid var(--line)}.exercise{width:100%;display:grid;grid-template-columns:84px 1fr 24px;gap:14px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);background:#fff;padding:14px 0}.thumb{width:84px;height:68px}.thumb svg{width:100%;height:100%}.thumb img{width:100%;height:100%;object-fit:cover;object-position:center 18%;background:#fff}.exercise h3{font-size:1rem;margin-bottom:5px}.exercise p{color:var(--muted);font-size:.82rem}
    .history{padding:16px 0;border-bottom:1px solid var(--line)}.history h3{margin-bottom:6px}.history p{font-size:.85rem;color:var(--muted)}
    dialog{width:min(100% - 24px,720px);height:min(88vh,820px);border:1px solid var(--ink);border-radius:18px;padding:20px;background:#fff}dialog::backdrop{background:rgba(0,0,0,.28);backdrop-filter:blur(3px)}
    .dialoghead{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:18px}.dialoghead h2{font-size:2rem}.dialoglist{max-height:calc(88vh - 180px);overflow:auto}
    .settings{border-top:1px solid var(--line)}.setting{display:flex;justify-content:space-between;padding:16px 0;border-bottom:1px solid var(--line);gap:20px}.reset{margin-top:28px;width:100%;padding:12px;background:#fff;border:1px solid var(--ink)}
    @media(min-width:700px){.shell{padding-left:34px;padding-right:34px}.stage{min-height:360px}}
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div><p class="eyebrow" id="date"></p><h1>GYMSO</h1></div>
    <button class="icon">•••</button>
  </header>

  <main>
    <section id="workout" class="screen active">
      <div class="rowhead">
        <div><p class="eyebrow">TODAY</p><h2>Workout</h2></div>
        <button id="addExercise" class="text">+ Add exercise</button>
      </div>
      <div id="tabs" class="tabs"></div>

      <article class="detail">
        <div class="detailhead">
          <div><p class="eyebrow" id="meta"></p><h2 id="name"></h2></div>
          <button id="changeExercise" class="text">Change</button>
        </div>

        <div id="stage" class="stage"></div>

        <div class="block">
          <p class="eyebrow">LAST TIME</p>
          <p id="lastDate" class="muted" style="margin-bottom:10px"></p>
          <div id="lastSets"></div>
        </div>

        <div class="block">
          <div class="thead"><span>SET</span><span>LB</span><span>REPS</span><span></span></div>
          <div id="setRows"></div>
          <button id="addSet" class="addset">+ Add set</button>
        </div>

        <div class="block rest">
          <div><p class="eyebrow">REST</p><p class="muted">Tap timer to reset</p></div>
          <button id="timer" class="timer">00:00</button>
        </div>

        <div class="block">
          <p class="eyebrow">ASK ABOUT THIS EXERCISE</p>
          <form id="askForm" class="ask">
            <input id="askInput" placeholder="Why did my reps drop?" autocomplete="off">
            <button>↑</button>
          </form>
          <div id="answer" class="answer" hidden></div>
        </div>
      </article>
    </section>

    <section id="history" class="screen">
      <div class="rowhead"><div><p class="eyebrow">PROGRESS</p><h2>History</h2></div></div>
      <div id="historyList" class="list"></div>
    </section>

    <section id="exercises" class="screen">
      <div class="rowhead"><div><p class="eyebrow">DATABASE</p><h2>Exercises</h2></div></div>
      <label class="search"><span>SEARCH</span><input id="librarySearch" placeholder="Bench press, chest, cable…"></label>
      <div id="library" class="list"></div>
    </section>

    <section id="you" class="screen">
      <div class="rowhead"><div><p class="eyebrow">SETTINGS</p><h2>You</h2></div></div>
      <div class="settings">
        <div class="setting"><span>Units</span><strong>lb</strong></div>
        <div class="setting"><span>Storage</span><strong>On this device</strong></div>
        <div class="setting"><span>AI</span><strong>Not connected yet</strong></div>
      </div>
      <button id="reset" class="reset">Reset demo data</button>
    </section>
  </main>

  <nav>
    <button class="nav active" data-screen="workout"><b>⌁</b>WORKOUT</button>
    <button class="nav" data-screen="history"><b>◷</b>HISTORY</button>
    <button class="nav" data-screen="exercises"><b>□</b>EXERCISES</button>
    <button class="nav" data-screen="you"><b>○</b>YOU</button>
  </nav>
</div>

<dialog id="picker">
  <div class="dialoghead">
    <div><p class="eyebrow">ADD EXERCISE</p><h2>Choose movement</h2></div>
    <button id="closePicker" class="icon">×</button>
  </div>
  <label class="search" style="margin-top:20px"><span>SEARCH</span><input id="pickerSearch" placeholder="Search exercises"></label>
  <div id="pickerList" class="list dialoglist"></div>
</dialog>

<script>
const EX=[
{id:"bench",name:"Bench Press",equipment:"Barbell",muscle:"Chest",image:"bench-press.webp"},
{id:"incline",name:"Incline Dumbbell Press",equipment:"Dumbbells",muscle:"Chest",image:"incline-dumbbell-press.webp"},
{id:"ohp",name:"Dumbbell Overhead Press",equipment:"Dumbbells",muscle:"Shoulders",image:"dumbbell-overhead-press.webp"},
{id:"lateral",name:"Lateral Raise",equipment:"Dumbbells",muscle:"Shoulders",image:"lateral-raise.webp"},
{id:"pulldown",name:"Lat Pulldown",equipment:"Cable",muscle:"Back",image:"lat-pulldown.webp"},
{id:"cablerow",name:"Seated Cable Row",equipment:"Cable",muscle:"Back",image:"seated-cable-row.webp"},
{id:"row",name:"Bent-Over Barbell Row",equipment:"Barbell",muscle:"Back",image:"bent-over-barbell-row.webp"},
{id:"squat",name:"Back Squat",equipment:"Barbell",muscle:"Legs",image:"back-squat.webp"},
{id:"rdl",name:"Romanian Deadlift",equipment:"Barbell",muscle:"Posterior Chain",image:"romanian-deadlift.webp"},
{id:"legpress",name:"Leg Press (45°)",equipment:"Machine",muscle:"Legs",image:"leg-press.webp"}
];
const KEY="gymso-v1";
const DEFAULT={
 workout:["bench","row","lateral"],active:"bench",
 logs:{
  bench:[{w:185,r:10,d:false},{w:185,r:9,d:false},{w:185,r:"",d:false}],
  row:[{w:115,r:10,d:false},{w:115,r:10,d:false},{w:115,r:"",d:false}],
  lateral:[{w:20,r:12,d:false},{w:20,r:12,d:false},{w:20,r:"",d:false}]
 },
 history:[
  {date:"Aug 14",exercise:"Bench Press",sets:["185 × 10","185 × 9","185 × 8"]},
  {date:"Aug 14",exercise:"Bent-Over Barbell Row",sets:["115 × 10","115 × 10","115 × 8"]},
  {date:"Aug 12",exercise:"Bench Press",sets:["180 × 10","180 × 10","180 × 9"]}
 ]
};
let state=load(),restStart=null,timerInt=null,raf=null;
const $=id=>document.getElementById(id);
function copyDefault(){return JSON.parse(JSON.stringify(DEFAULT))}
function load(){try{return JSON.parse(localStorage.getItem(KEY))||copyDefault()}catch{return copyDefault()}}
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function ex(id){return EX.find(x=>x.id===id)}
function current(){return ex(state.active)||EX[0]}
function ensure(id){if(!state.logs[id])state.logs[id]=[{w:"",r:"",d:false},{w:"",r:"",d:false},{w:"",r:"",d:false}];return state.logs[id]}
function render(){renderTabs();renderDetail();renderHistory();renderList($("library"),$("librarySearch").value,false);renderList($("pickerList"),$("pickerSearch").value,true)}
function renderTabs(){
 $("tabs").innerHTML="";
 state.workout.forEach(id=>{const x=ex(id);if(!x)return;const b=document.createElement("button");b.className="chip "+(id===state.active?"active":"");b.textContent=x.name;b.onclick=()=>{state.active=id;save();render()};$("tabs").appendChild(b)})
}
function renderDetail(){
 const x=current();$("name").textContent=x.name;$("meta").textContent=(x.equipment+" · "+x.muscle).toUpperCase();renderStage(x);renderLast(x);renderSets(x)
}
function renderLast(x){
 const last=state.history.find(h=>h.exercise===x.name);$("lastDate").textContent=last?last.date:"No previous workout";
 $("lastSets").innerHTML=last?last.sets.map(s=>'<div class="lastset">'+s+"</div>").join(""):'<div class="lastset muted">Your first logged session will appear here.</div>'
}
function renderSets(x){
 const host=$("setRows");host.innerHTML="";
 ensure(x.id).forEach((s,i)=>{
  const row=document.createElement("div");row.className="setrow";
  const n=document.createElement("strong");n.textContent=i+1;
  const w=document.createElement("input");w.type="number";w.inputMode="decimal";w.placeholder="—";w.value=s.w;w.oninput=()=>{s.w=w.value;save()};
  const r=document.createElement("input");r.type="number";r.inputMode="numeric";r.placeholder="—";r.value=s.r;r.oninput=()=>{s.r=r.value;save()};
  const d=document.createElement("button");d.className="done "+(s.d?"on":"");d.onclick=()=>{s.d=!s.d;if(s.d)startTimer();save();renderSets(x)};
  row.append(n,w,r,d);host.appendChild(row)
 })
}
function startTimer(){restStart=Date.now();clearInterval(timerInt);tick();timerInt=setInterval(tick,1000)}
function tick(){if(!restStart)return;const e=Math.floor((Date.now()-restStart)/1000);$("timer").textContent=String(Math.floor(e/60)).padStart(2,"0")+":"+String(e%60).padStart(2,"0")}
function renderStage(x){
 cancelAnimationFrame(raf);
 $("stage").innerHTML=`<img src="${x.image}" alt="${x.name} exercise guide showing movement, primary muscles, and secondary muscles">`;
}
function thumb(x){
 return `<img src="${x.image}" alt="" loading="lazy">`;
}
function renderList(host,q,picker){
 q=(q||"").toLowerCase();host.innerHTML="";
 EX.filter(x=>(x.name+" "+x.equipment+" "+x.muscle).toLowerCase().includes(q)).forEach(x=>{
  const b=document.createElement("button");b.className="exercise";b.innerHTML=`<span class="thumb">${thumb(x)}</span><span><h3>${x.name}</h3><p>${x.equipment} · ${x.muscle}</p></span><span>→</span>`;
  b.onclick=()=>{if(!state.workout.includes(x.id))state.workout.push(x.id);state.active=x.id;ensure(x.id);save();if(picker)$("picker").close();show("workout");render()};host.appendChild(b)
 })
}
function renderHistory(){$("historyList").innerHTML=state.history.map(h=>`<div class="history"><h3>${h.exercise}</h3><p>${h.date} · ${h.sets.join(" · ")}</p></div>`).join("")}
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("active",s.id===id));document.querySelectorAll(".nav").forEach(n=>n.classList.toggle("active",n.dataset.screen===id));scrollTo({top:0,behavior:"smooth"})}
function openPicker(){$("pickerSearch").value="";renderList($("pickerList"),"",true);$("picker").showModal()}
document.querySelectorAll(".nav").forEach(n=>n.onclick=()=>show(n.dataset.screen));
$("addExercise").onclick=openPicker;$("changeExercise").onclick=openPicker;$("closePicker").onclick=()=>$("picker").close();
$("pickerSearch").oninput=e=>renderList($("pickerList"),e.target.value,true);$("librarySearch").oninput=e=>renderList($("library"),e.target.value,false);
$("addSet").onclick=()=>{const a=ensure(state.active),last=a[a.length-1]||{w:""};a.push({w:last.w,r:"",d:false});save();renderSets(current())};
$("timer").onclick=()=>{restStart=null;clearInterval(timerInt);$("timer").textContent="00:00"};
$("askForm").onsubmit=e=>{e.preventDefault();const q=$("askInput").value.trim();if(!q)return;const x=current(),sets=ensure(x.id).filter(s=>s.d).map(s=>`${s.w||"—"} lb × ${s.r||"—"}`).join(", ")||"No completed sets yet";$("answer").hidden=false;$("answer").innerHTML=`<strong>AI comes in the next phase.</strong><br><br>The app has already prepared the context it would send: <em>${x.name} · ${sets}</em><br><br>Your question: “${q.replace(/[<>]/g,"")}”`};
$("reset").onclick=()=>{state=copyDefault();save();render();show("workout")};
$("date").textContent=new Intl.DateTimeFormat("en-CA",{weekday:"long",month:"long",day:"numeric"}).format(new Date()).toUpperCase();
render();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
